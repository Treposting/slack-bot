display_information:
  name: Slack Cleaner
  description: Find and delete your own messages
oauth_config:
  redirect_urls:
    - http://localhost:3000/auth/slack/callback
  scopes:
    user:
      - channels:read
      - groups:read
      - im:read
      - mpim:read
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - chat:write
      - users:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
